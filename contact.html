<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Contacter Chamsdine Koudri pour un stage ou une alternance à partir de janvier 2027.">
  <title>Contact - Chamsdine Koudri</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- ===== BARRE DU HAUT : retour au menu + titre de la page ===== -->
  <header class="barre-haut">
    <a href="menu.html" class="retour" aria-label="Retour au menu">‹ <span>Menu</span></a>
    <h1 class="titre-ecran">Contact</h1>
  </header>

  <main>

    <!-- ===== CONTACT ===== -->
    <section class="panneau contact">
      <p>Je recherche un <strong>stage</strong> ou une <strong>alternance</strong> à partir de <strong>janvier 2027</strong>.</p>

      <div class="liens">
        <a href="mailto:chamsdine.koudri@epitech.eu">Email</a>
        <a href="https://www.linkedin.com/in/chamsdine-koudri/" target="_blank" rel="noopener">LinkedIn</a>
        <a href="https://github.com/Chamskdrr" target="_blank" rel="noopener">GitHub</a>
      </div>

      <form id="formulaire">
        <label for="nom">Nom</label>
        <input type="text" id="nom" name="nom" required>

        <label for="email">Email</label>
        <input type="email" id="email" name="email" required>

        <label for="message">Message</label>
        <textarea id="message" name="message" rows="5" required></textarea>

        <button type="submit" class="bouton">Envoyer</button>
        <p id="confirmation"></p>
      </form>
    </section>

    <!-- ===== PAGE PRÉCÉDENTE ===== -->
    <nav class="navigation-bas" aria-label="Pages voisines">
      <a href="quetes.html">‹ Quêtes</a>
      <span></span>
    </nav>

  </main>

  <footer>
    <p>FecaDoCrit</p>
  </footer>

  <!-- Le script ne sert que sur cette page : il gère le formulaire -->
  <script src="js/script.js"></script>
</body>
</html>
